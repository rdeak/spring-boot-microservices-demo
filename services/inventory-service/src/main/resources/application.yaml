spring:
  config:
    import: optional:file:../../.env[.properties],classpath:saga-messaging-tracing.yaml
  task:
    scheduling:
      pool:
        size: 4
  application:
    name: inventory-service
  docker:
    compose:
      file: ../../docker-compose.yaml
      lifecycle-management: start-only
      skip:
        in-tests: false
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:micro-services}
    username: ${DB_USER:dev}
    password: ${DB_PASSWORD:dev}
    hikari:
      schema: ${app.schema}
  flyway:
    schemas: ${app.schema}
    locations: classpath:db/saga-messaging,classpath:db/migration/inventory
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: ${app.schema}
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:dev}
    password: ${RABBITMQ_PASSWORD:dev}

app:
  schema: inventory

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics

server:
  port: 8082

saga:
  messaging:
    service: inventory
    admin-path: /api/inventory/admin
