spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: order-service
              uri: http://localhost:8081
              predicates:
                - Path=/api/orders/**
            - id: inventory-service
              uri: http://localhost:8082
              predicates:
                - Path=/api/inventory/**
            - id: shipping-service
              uri: http://localhost:8083
              predicates:
                - Path=/api/shipping/**

server:
  port: 8080

management:
  tracing:
    sampling:
      probability: 1.0
  opentelemetry:
    tracing:
      export:
        otlp:
          endpoint: ${OTLP_TRACES_ENDPOINT:http://localhost:4318/v1/traces}
  otlp:
    metrics:
      export:
        enabled: false
