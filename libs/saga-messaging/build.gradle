import org.springframework.boot.gradle.plugin.SpringBootPlugin

plugins {
    id 'java-library'
    id 'java-test-fixtures'
}

dependencies {
    api platform(SpringBootPlugin.BOM_COORDINATES)

    api 'org.springframework.boot:spring-boot-starter-amqp'

    implementation 'org.springframework.boot:spring-boot-starter-jdbc'
    implementation 'org.springframework.boot:spring-boot-starter-jackson'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'io.micrometer:micrometer-tracing'

    compileOnly 'org.springframework:spring-webmvc'

    testFixturesApi 'org.springframework.boot:spring-boot-starter-test'
    testFixturesApi 'org.awaitility:awaitility'
    testFixturesApi 'org.springframework.boot:spring-boot-starter-jdbc'
    testFixturesApi 'io.micrometer:micrometer-core'
    testFixturesImplementation 'tools.jackson.core:jackson-databind'

    testImplementation 'org.springframework.boot:spring-boot-starter-flyway'
    testImplementation 'org.springframework.boot:spring-boot-starter-webmvc'
    testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
    testImplementation 'org.springframework.boot:spring-boot-docker-compose'
    testImplementation 'org.springframework.boot:spring-boot-starter-opentelemetry'
    testImplementation 'org.springframework.boot:spring-boot-micrometer-tracing-test'

    testRuntimeOnly 'org.flywaydb:flyway-database-postgresql'
    testRuntimeOnly 'org.postgresql:postgresql'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.withType(JavaCompile).configureEach {
    options.compilerArgs << '-parameters'
}

tasks.register('cleanTestLeftovers', JavaExec) {
    group = 'verification'
    description = 'Drops test schemas and RabbitMQ objects left behind by crashed or killed test runs.'
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'hr.bertlab.saga.messaging.test.TestLeftoverCleaner'
    // -PstaleAfterMinutes=0 also removes runs that look recent; only use it when no tests are running
    systemProperty 'staleAfterMinutes', findProperty('staleAfterMinutes') ?: '30'
}
